  text:
    - - file: a.pdf
        method: text
        pages:
          - "Northwind Office Supply\nInvoice No: INV-2026-1040\nInvoice Date: 2026-09-01\nDescription Qty Unit Price Amount\nToner cartridge black 2 68.00 136.00\nDesk chair, ergonomic 1 1,189.99 1,189.99\nSubtotal: 1,325.99\nTax (8%): 106.08\nTotal: 1,432.07"
