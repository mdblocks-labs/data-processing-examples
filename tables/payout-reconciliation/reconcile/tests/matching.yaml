# Both ways of tying a deposit. P1's ID is in its deposit's description, in lower case,
# so it ties by ID although the deposit lands a week later. M1 has no ID in any
# description: it ties to the one deposit of its amount dated 0 to 3 days after it.
# P2's deposit names it but is short by 2.50: amount differs, with the gap. P3's refunds
# outweigh its charge, and its negative payout ties to a debit. The market's refunds and
# fees are positive in its export (negate). A debit no payout explains is not a deposit.
# "CAFÉP1" does not carry P1 as a whole word, so T6 is a deposit no payout explains.
