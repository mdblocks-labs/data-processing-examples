# A payout with no deposit is in transit until the bank rows reach match_days (3)
# past its date, then no deposit. The bank rows reach 2026-10-10: P1 (2026-10-07) has
# waited three days and has no deposit; P2 (2026-10-08) and P3, dated after the last
# bank row, are in transit. A deposit outside the window of M1's amount stays open on
# both sides: dated 4 days after it, it is no payout.
mdblocks: 1
given:
  files:
  - - file: card.csv
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      header: [Charge, Created, Amount, Currency, Payout, Paid]
      rows:
      - [ch1, '2026-10-06', '10.00', usd, P1, '2026-10-07']
      - [ch2, '2026-10-07', '20.00', usd, P2, '2026-10-08']
      - [ch3, '2026-10-09', '30.00', usd, P3, '2026-10-12']
      error: null
  - - file: market.csv
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      header: [Order, Date, Total, Settlement, Settled]
      rows:
      - [M-1, 10/01/2026, '40.00', M1, 10/02/2026]
      error: null
  - - file: bank.csv
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      header: [Transaction, Posted, Amount, Description]
      rows:
      - [T1, '2026-10-06', '40.00', MARKET CREDIT]
      - [T2, '2026-10-10', '-5.00', SERVICE FEE]
      error: null
  sources: '@sources.json'
  merchant:
    name: Test Co
    currency: USD
    match_days: 3
  approvals: null
expect:
  report:
    merchant: Test Co
    currency: USD
    match_days: 3
    bank_through: '2026-10-10'
    months:
    - month: 2026-10
      checksum: 0dfe2fbfe7851b272ae47b18982c9065180c051631a97d19d708bdd4b1f10283
      status: not approved
      approvals: []
      totals:
        payouts: 4
        paid_out: 10000
        orders: 10000
        refunds: 0
        fees: 0
        deposits: 1
        deposited: 4000
        matched: 0
        open_payouts: 2
        open_deposits: 1
        in_transit: 2
    payouts:
    - processor: card
      payout_id: P1
      date: '2026-10-07'
      dates: ['2026-10-07']
      month: 2026-10
      amount: 1000
      orders: 1000
      refunds: 0
      fees: 0
      status: no deposit
      bank: null
      difference: null
    - processor: card
      payout_id: P2
      date: '2026-10-08'
      dates: ['2026-10-08']
      month: 2026-10
      amount: 2000
      orders: 2000
      refunds: 0
      fees: 0
      status: in transit
      bank: null
      difference: null
    - processor: card
      payout_id: P3
      date: '2026-10-12'
      dates: ['2026-10-12']
      month: 2026-10
      amount: 3000
      orders: 3000
      refunds: 0
      fees: 0
      status: in transit
      bank: null
