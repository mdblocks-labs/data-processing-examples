# A payout whose rows give different payout dates is dates differ, placed by the
# latest, and tied by ID only. P1's deposit names it, so the deposit is matched and
# P1 stays open as dates differ. M1's deposit has its amount and date, but M1 can't be
# tied by amount: both stay open.
mdblocks: 1
given:
  files:
  - - file: card.csv
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      header: [Charge, Created, Amount, Currency, Payout, Paid]
      rows:
      - [ch1, '2026-09-29', '10.00', usd, P1, '2026-09-30']
      - [ch2, '2026-09-30', '15.00', usd, P1, '2026-10-01']
      error: null
  - - file: market.csv
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      header: [Order, Date, Total, Settlement, Settled]
      rows:
      - [M-1, 10/01/2026, '20.00', M1, 10/02/2026]
      - [M-2, 10/01/2026, '30.00', M1, 10/03/2026]
      error: null
  - - file: bank.csv
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      header: [Transaction, Posted, Amount, Description]
      rows:
      - [T1, '2026-10-02', '25.00', CARD P1]
      - [T2, '2026-10-04', '50.00', MARKET CREDIT]
      error: null
  sources: '@sources.json'
  merchant:
    name: Test Co
    currency: USD
    match_days: 3
  approvals: null
