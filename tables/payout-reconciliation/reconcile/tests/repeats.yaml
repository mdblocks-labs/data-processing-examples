      row: 2
      problem: card_orders ID ch1 is repeated in b/card.csv row 2, which is counted
    - file: b/card.csv
      row: 3
      problem: card_orders ID ch2 is repeated in b/card.csv row 4, which is counted
    - file: bank.csv
      row: 2
      problem: bank ID T1 is repeated in bank.csv row 3, which is counted
