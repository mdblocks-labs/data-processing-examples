      bank_row: 3
    - month: 2026-10
      status: matched
      file: bank.csv
      row: 3
      source: bank
      kind: bank
      id: T1
      date: '2026-10-03'
      amount: 1700
      processor: card
      payout_id: P1
      payout_date: null
      description: CARD P1
      bank_file: null
      bank_row: null
    - month: 2026-10
      status: matched
      file: refunds.csv
      row: 2
      source: card_refunds
      kind: refunds
      id: ch1
      date: '2026-10-01'
      amount: -100
      processor: card
      payout_id: P1
      payout_date: '2026-10-02'
