      bank_file: bank.csv
      bank_row: 3
    files:
    - file: a/card.csv
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      source: card_orders
      rows: 1
      first: '2026-10-01'
      last: '2026-10-01'
      total: 1000
    - file: b/card.csv
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      source: card_orders
      rows: 3
